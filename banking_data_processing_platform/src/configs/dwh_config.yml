        - transaction_bk
        - category_sk
        - category_bk
        - card_sk_sender
        - card_bk_sender
        - card_sk_recipient
        - card_bk_recipient
        - payment_method
        - payment_date
        - status
        - dm_loaded_at

      fact_transactions:
        - transaction_sk
